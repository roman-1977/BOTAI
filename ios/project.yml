name: BOTAI
options:
  bundleIdPrefix: com.botai
  deploymentTarget:
    iOS: '18.0'
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  BOTAI:
    type: application
    platform: iOS
    sources: [BOTAI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.botai.app
        CODE_SIGN_ENTITLEMENTS: BOTAI/BOTAI.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BOTAI
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GRDB
        product: GRDB
    scheme:
      testTargets: [BOTAITests]
  BOTAITests:
    type: bundle.unit-test
    platform: iOS
    sources: [BOTAITests]
    dependencies:
      - target: BOTAI
